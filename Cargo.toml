[package]
name = "exo-planets"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Kipping-signature transit / TTV / TDV features and a small linfa trainer on public NASA KOI/PS slices"
license = "MIT"
repository = "https://github.com/LewisAGI/exo-planets"
readme = "README.md"
keywords = ["exoplanet", "exomoon", "ttv", "kepler", "kipping"]
categories = ["science"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
linfa = "0.7.1"
linfa-logistic = "0.7.1"
ndarray = "0.15"
rand = "0.8"
rand_chacha = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
ureq = { version = "2.12", features = ["tls"] }

[dev-dependencies]
approx = "0.5"

[[bin]]
name = "exo-planets"
path = "src/main.rs"
